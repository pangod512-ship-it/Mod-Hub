plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.0.116'
}
apply from: '../../gradle/modern-sources.gradle'
apply from: '../../gradle/neoforge-jarcontents.gradle'

def mc = findProperty('mcVersion') ?: '1.20.2'
def target = new groovy.json.JsonSlurper().parse(file('../modern-targets.json')).find { it.minecraft == mc }
if (!(mc in ['1.20.2', '1.20.3', '1.20.5'])) throw new GradleException("Use ModDevGradle for ${mc}")
ext.neoGradleLegacy = true
version = '1.1.1'
group = 'com.pangod512.modhub'
base { archivesName = 'modhub' }
layout.buildDirectory.set(file("build/${mc}"))
java.toolchain.languageVersion = JavaLanguageVersion.of(target.java as int)
dependencies { implementation "net.neoforged:neoforge:${target.neoforge}" }
sourceSets.main.extensions.getByName('runs').modIdentifier('modhub')
runs {
    client {
        workingDirectory = file("run/${mc}")
        modSource sourceSets.main
    }
}
apply from: '../../gradle/neoforge-common.gradle'
